name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Go Mobile Core
      run: |
        mkdir -p app/libs
        export ANDROID_NDK_HOME=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
        echo "Using NDK: $ANDROID_NDK_HOME"
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        gomobile init
        git clone --depth 1 https://github.com/p1neappleXpress/OpenFlux.git /tmp/openflux-core
        cd /tmp/openflux-core
        gomobile bind -target=android/arm64,android/arm -androidapi=26 -ldflags="-s -w" -o "$GITHUB_WORKSPACE/app/libs/mobile.aar" ./mobile
        ls -lh "$GITHUB_WORKSPACE/app/libs/mobile.aar"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: openflux-android-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
